name: Postiz v2.23.0 Post for Me
on:
  push:
    branches: [postforme-v2.23.0]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/dayanjinglsylsy-tech/postiz-app
  TAG: postforme-v2.23.0-${{ github.sha }}
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Construct accepted candidate
        run: |
          git clone --filter=blob:none https://github.com/gitroomhq/postiz-app.git candidate
          cd candidate
          git checkout 1e4c8dd5c4f70c4d0abd01e23cc42d5b533d1ab9
          curl -fsSL https://raw.githubusercontent.com/erykkruk/postiz-app/ccf70a52ccafb3513b97473a0f2cfdbb09a625b5/libraries/nestjs-libraries/src/integrations/social/postforme.provider.ts -o libraries/nestjs-libraries/src/integrations/social/postforme.provider.ts
          curl -fsSL https://raw.githubusercontent.com/erykkruk/postiz-app/ccf70a52ccafb3513b97473a0f2cfdbb09a625b5/apps/frontend/public/icons/platforms/postforme.png -o apps/frontend/public/icons/platforms/postforme.png
          git apply ../postforme.patch
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        working-directory: candidate
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} -f Dockerfile.dev             -t ${IMAGE}:${TAG}-${{ matrix.arch }}             --build-arg NEXT_PUBLIC_VERSION=${TAG}             --pull --no-cache --provenance=false --sbom=false             --output type=registry .
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish immutable manifest
        run: |
          docker buildx imagetools create             -t ${IMAGE}:${TAG}             ${IMAGE}:${TAG}-amd64             ${IMAGE}:${TAG}-arm64
          docker buildx imagetools inspect ${IMAGE}:${TAG}
